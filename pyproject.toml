[project]
name = "conformance-fuzzer"
version = "0.1.0"
description = "Differential conformance fuzzer for constrained-decoding engines"
requires-python = ">=3.12"
dependencies = [
    "xgrammar==0.2.4",
    "transformers>=4.44",
    "torch>=2.4",
    "jsonschema>=4.23",
    "hypothesis>=6.0",
    "llguidance==1.8.0",
    "outlines-core==0.2.14",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fuzzer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
